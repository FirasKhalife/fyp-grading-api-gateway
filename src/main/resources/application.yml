spring:
  application:
    name: api-gateway
  config:
    # Shared settings from config-server (fyp-grading-config). Optional: this file is complete on its own.
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8071}/config"
  cloud:
    config:
      fail-fast: false
    # No bulkhead around the routes. The Resilience4J starter adds one by default: 25 calls in flight per route,
    # shared by every visitor, and the 26th gets the "starting up" 503 at once. The per-IP rate limit and the
    # services' own thread pools bound the load instead.
    circuitbreaker:
      bulkhead:
        resilience4j:
          enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVER_URL:http://localhost:7080/realms/assay}/protocol/openid-connect/certs
          # Fetch the keys over the internal network, but only accept tokens whose issuer is the public URL Keycloak
          # puts in them (KC_HOSTNAME). Setting both means no discovery call: Boot only adds the issuer check.
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:7080/realms/assay}

assay:
  cors:
    # The SPA origin(s); a comma-separated list of patterns.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:[*]}
  gateway:
    rate-limit: {replenish-rate: 20, burst-capacity: 60}     # per client IP: browsing and autosave
    # Per client IP: creating or resetting a demo copy costs 60 tokens at 1 token/s, so one a minute, ten in a burst.
    heavy-limit: {replenish-rate: 1, burst-capacity: 600, requested-tokens: 60}
    # Addresses or CIDR blocks whose CF-Connecting-IP is believed (cloudflared). Empty: use the socket address.
    trusted-proxies: ${TRUSTED_PROXIES:}
    streams:
      - {id: notification-stream, service: notification-service, paths: [/api/notifications/stream]}
    heavy:
      - {id: demo-copy, service: admin-service, paths: [/api/demo/session, /api/demo/session/reset], methods: [PUT, POST]}
    routes:
      - id: admin
        service: admin-service
        paths: [/api/demo/**, /api/me, /api/me/**, /api/assessments, /api/assessments/**, /api/teams, /api/teams/**,
                /api/reviewers, /api/reviewers/**, /api/schedule, /api/overview, /api/overview/**]
      - {id: evaluation, service: evaluation-service, paths: [/api/evaluations, /api/evaluations/**, /api/my-evaluations/**]}
      - {id: rubric, service: rubric-service, paths: [/api/rubrics, /api/rubrics/**]}
      - {id: notification, service: notification-service, paths: [/api/notifications, /api/notifications/**, /api/activity, /api/activity/**]}

server:
  port: ${PORT:9191}
  shutdown: graceful

eureka:
  client:
    # Register and refresh quickly: the services start together and find each other (and the config server) by name.
    initial-instance-info-replication-interval-seconds: 2
    registry-fetch-interval-seconds: 5
    service-url:
      defaultZone: ${REGISTRY_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  server:
    port: ${MANAGEMENT_PORT:9192}   # actuator off the public port; never published
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: ${spring.application.name}
    description: "Assay API gateway"
    version: ${BUILD_VERSION:dev}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - {name: admin-service, url: /v3/api-docs/admin-service}
      - {name: evaluation-service, url: /v3/api-docs/evaluation-service}
      - {name: rubric-service, url: /v3/api-docs/rubric-service}
      - {name: notification-service, url: /v3/api-docs/notification-service}
